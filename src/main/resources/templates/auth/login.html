<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .login-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        input {
            width: 95%;
            padding: 8px;
            margin: 10px 0;
        }
        button {
            background-color: #007BFF;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Iniciar Sesión</h2>
    <div th:if="${param.error}" style="color: red; margin-bottom:15px;">
        Usuario o contraseña incorrectos. Inténtalo de nuevo.
    </div>
    <div th:if="${param.logout}" style="color: green; margin-bottom:15px;">
        Has cerrado sesión exitosamente.
    </div>
    <div th:if="${param.registered}" style="color: green; margin-bottom:15px;">
        Te registraste exitosamente.
    </div>
    <form action="/auth/process-login" method="post">
        <label>Email:</label>
        <input type="text" name="username" required>
        <label>Contraseña:</label>
        <input type="password" name="password" required>
        <button type="submit">Ingresar</button>
        <a href="/auth">
            <button type="button">Volver</button>
        </a>
    </form>
</div>
</body>
</html>
