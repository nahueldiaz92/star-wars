<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrarse</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .register-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        input {
            width: 95%;
            padding: 8px;
            margin: 10px 0;
        }
        button {
            background-color: #007BFF;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div class="register-container">
    <h2>Registrarse</h2>
    <form action="/auth/register" method="post" th:object="${registerRequest}">

        <div th:if="${error}" style="color: red; margin-bottom:15px;">
            <span th:text="${error}"></span>
        </div>

        <label>Email:</label>
        <input type="email" th:field="*{email}" required>
        <span th:errors="*{email}" class="error"></span>

        <label>Contraseña:</label>
        <input type="password" th:field="*{password}" required />
        <span th:errors="*{password}" class="error"></span>

        <button type="submit">Registrarse</button>

        <a href="/auth">
            <button type="button">Volver</button>
        </a>
    </form>

    <p>¿Ya tienes una cuenta? <a th:href="@{/auth/login}">Inicia sesión</a></p>
</div>
</body>
</html>
