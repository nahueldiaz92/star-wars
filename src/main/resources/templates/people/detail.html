<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${person.name} + ' - Detalle'">Detalle Personaje</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <h2 th:text="${person.name}">Nombre Personaje</h2>
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-6">
          <p><strong>Altura:</strong> <span th:text="${person.height}">?</span> cm</p>
          <p><strong>Peso:</strong> <span th:text="${person.mass}">?</span> kg</p>
          <p><strong>Color de pelo:</strong> <span th:text="${person.hair_color}">?</span></p>
        </div>
        <div class="col-md-6">
          <p><strong>Color de piel:</strong> <span th:text="${person.skin_color}">?</span></p>
          <p><strong>Color de ojos:</strong> <span th:text="${person.eye_color}">?</span></p>
          <p><strong>Año de nacimiento:</strong> <span th:text="${person.birth_year}">?</span></p>
        </div>
      </div>
      <a href="/people" class="btn btn-primary mt-3">Volver al listado</a>
    </div>
  </div>
</div>
</body>
</html>
