<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Personajes de Star Wars</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-2">
    <h1>Personajes de Star Wars</h1>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="person : ${peopleList}">
            <td th:text="${person.name}">Nombre</td>
            <td>
                <a th:href="@{/people/{id}(id=${person.uid})}"
                   class="btn btn-info btn-sm">Ver detalle</a>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Paginación -->
    <nav>
        <ul class="pagination">
            <li class="page-item" th:classappend="${!hasPrevious} ? 'disabled'">
                <a th:href="@{/people(page=${currentPage - 1})}"
                   class="page-link"
                   th:unless="${!hasPrevious}">Anterior</a>
                <span class="page-link" th:if="${!hasPrevious}">Anterior</span>
            </li>

            <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a th:href="@{/people(page=${i})}"
                   class="page-link"
                   th:text="${i}">1</a>
            </li>

            <li class="page-item" th:classappend="${!hasNext} ? 'disabled'">
                <a th:href="@{/people(page=${currentPage + 1})}"
                   class="page-link"
                   th:unless="${!hasNext}">Siguiente</a>
                <span class="page-link" th:if="${!hasNext}">Siguiente</span>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
