<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Búsqueda de Personajes Star Wars</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <style>
    .character-card {
        transition: transform 0.3s;
    }
    .character-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
<div class="container mt-4">
  <!-- Formulario de búsqueda -->
  <div class="card mb-4">
    <div class="card-header bg-primary text-white">
      <h2><i class="bi bi-search"></i> Búsqueda de Personajes Star Wars</h2>
    </div>
    <div class="card-body">
      <form th:action="@{/people/search}" method="get">
        <div class="input-group mb-3">
          <input type="text" class="form-control"
                 name="name" th:value="${param.name}"
                 placeholder="Ej: Luke Skywalker, Leia, Vader..." required>
          <button class="btn btn-primary" type="submit">
            <i class="bi bi-search"></i> Buscar
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Resultados de búsqueda -->
  <div th:if="${searchPerformed}">
    <div th:if="${results != null && results.size > 0}">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Resultados para: <span class="text-primary" th:text="${param.name}"></span></h3>
        <div class="text-muted">
          Página <span th:text="${currentPage}"></span> de <span th:text="${totalPages}"></span>
        </div>
      </div>

      <!-- Listado de personajes (máximo 3 por página) -->
      <div class="row">
        <div class="col-md-4 mb-4" th:each="result : ${results}">
          <div class="card character-card h-100">
            <div class="card-header bg-secondary text-white">
              <h5 th:text="${result.properties.name}">Nombre</h5>
            </div>
            <div class="card-body">
              <p><strong>Altura:</strong> <span th:text="${result.properties.height}"></span> cm</p>
              <p><strong>Peso:</strong> <span th:text="${result.properties.mass}"></span> kg</p>
              <p><strong>Color de pelo:</strong> <span th:text="${result.properties.hair_color}"></span></p>
              <p><strong>Color de piel:</strong> <span th:text="${result.properties.skin_color}"></span></p>
              <p><strong>Color de ojos:</strong> <span th:text="${result.properties.eye_color}"></span></p>
              <p><strong>Año de nacimiento:</strong> <span th:text="${result.properties.birth_year}"></span></p>
            </div>
          </div>
        </div>
      </div>

      <!-- Controles de paginación -->
      <nav th:if="${totalPages > 1}" aria-label="Page navigation" class="mt-4">
        <ul class="pagination justify-content-center">
          <!-- Botón Anterior -->
          <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
            <a class="page-link"
               th:href="@{/people/search(name=${param.name}, page=${currentPage - 1})}"
               aria-label="Previous">
              <span aria-hidden="true">&laquo; Anterior</span>
            </a>
          </li>

          <!-- Números de página (opcional) -->
          <li th:each="i : ${#numbers.sequence(1, totalPages)}"
              class="page-item" th:classappend="${i == currentPage} ? 'active'">
            <a class="page-link"
               th:href="@{/people/search(name=${param.name}, page=${i})}"
               th:text="${i}"></a>
          </li>

          <!-- Botón Siguiente -->
          <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
            <a class="page-link"
               th:href="@{/people/search(name=${param.name}, page=${currentPage + 1})}"
               aria-label="Next">
              <span aria-hidden="true">Siguiente &raquo;</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>

    <div th:if="${results == null || results.size() == 0}" class="alert alert-warning">
      <i class="bi bi-exclamation-triangle"></i> No se encontraron personajes con ese nombre.
    </div>
  </div>

  <!-- Enlace para volver -->
  <div class="mt-3">
    <a href="/people" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left"></i> Volver al listado completo
    </a>
  </div>
</div>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</body>
</html>
